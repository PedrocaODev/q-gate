# q-gate configuration

[analysis]
# Languages to analyze
targets = ["java", "kotlin"]

# Analysis scope defaults
# "diff" or "full"
scope = "diff"

[rules.god_class]
max_methods = 20
max_loc = 500

[rules.layers]
ui = ["domain"]
domain = []
data = ["domain"]

[aspects.r8]
command = "python3 ../../scripts/r8_firewall.py"
stage = "pre-push"
enabled = true
severity = "error"
