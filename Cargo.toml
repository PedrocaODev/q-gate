[package]
name = "q-gate"
version = "0.1.0"
edition = "2024"

[dependencies]
tree-sitter = "0.24"
tree-sitter-java = "0.23"
tree-sitter-kotlin = { package = "brokk-tree-sitter-kotlin", version = "0.4.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
streaming-iterator = "0.1.9"
